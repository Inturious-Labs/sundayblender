baseURL = 'https://weekly.sundayblender.com/'
ignoreFiles = ['/xhs/', '/xhs-drafts\.md$']
languageCode = 'en-us'
timeZone = 'Asia/Shanghai'
title = 'The Sunday Blender'
canonifyURLs = true
theme = "diary"
googleAnalytics = "G-9WB2PSGYTC"

[outputs]
  home = ["HTML", "RSS"]

[permalinks]
	posts = "/p/:slug/"
	categories = "/categories/:slug/"

[taxonomies]
	category = "categories"

[params]
	subtitle = "make news fun for kids"
	description = 'The Sunday Blender is a weekly newsletter that curates the most interesting news from around the world, designed to help kids learn English and understand global events through engaging stories about technology, science, culture, and more.'
	googleSiteVerification = "JxPX7y3VViNkvKcIUZV1Mm0afi-kVQ8c2dI4QaVXZJM"
	enableOpenGraph = true
	enableTwitterCards = true
	enableReadingTime = true
	author = "Inturious Labs"
	author_bio = "A newsman making the best news for kids with AI tools"
	author_image = "/img/herbert-yang.jpg"
	logo = "/img/logo.png"
	favicon = "/img/favicon.ico"

	# Named editor: post bylines, the /author/ page, and NewsArticle JSON-LD.
	[params.editor]
		name = "Herbert Yang"
		alternateName = "Clayton Man"  # pen name used on early issues
		jobTitle = "Editor"
		profile = "https://herbertyang.xyz/docs/about/herbert-yang/"

[build]
	writeStats = true

[sitemap]
	entryLimit = 5000

# Ensure trailing slashes for better URL structure
uglyURLs = false

[markup]
	[markup.goldmark]
		[markup.goldmark.renderer]
			unsafe = true

[[menu.main]]
	name = "About"
	url = "/about/"
	weight = 1

[[menu.main]]
	name = "Archive"
	url = "/archive/"
	weight = 2

[[menu.main]]
	name = "Terms & Privacy"
	url = "/terms/"
	weight = 4
